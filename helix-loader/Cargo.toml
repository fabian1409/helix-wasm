[package]
name = "helix-loader"
description = "Build bootstrapping for Helix crates"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "hx-loader"
path = "src/main.rs"

[dependencies]
helix-stdx = { path = "../helix-stdx" }

anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
toml.workspace = true
etcetera.workspace = true
once_cell = "1.21"
parking_lot.workspace = true
sha2 = "0.11"
globset.workspace = true
log = "0.4"

tempfile.workspace = true

tree-house.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# cloning/compiling tree-sitter grammars
cc = { version = "1" }
threadpool = { version = "1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# No dlopen on wasm32 (libloading doesn't support it), so grammars are statically linked
# in via `tree-sitter-language` instead - see grammar.rs. `tree-house` (the crate name
# used above) doesn't forward that feature from the `tree-house-bindings` crate it wraps,
# so it's requested directly here; Cargo unifies the feature onto the same
# `tree-house-bindings` instance `tree-house` itself depends on.
tree-house-bindings = { version = "0.3", features = ["tree-sitter-language"] }
tree-sitter-rust = "0.23"
tree-sitter-toml-ng = "0.7"
tree-sitter-json = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-md = "0.5"
